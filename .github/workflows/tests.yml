name: Tests

# Push, not pull_request: on the CatLabInteractive repositories pull_request
# events do not produce runs, and every branch lives in the repo rather than
# a fork, so a push covers each PR too (same setup as Eukles).
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The test suite runs on orchestra/testbench with an in-memory
          # sqlite database.
          extensions: mbstring, pdo_sqlite, sqlite3, json
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          # No composer.lock is committed (library); key on composer.json.
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit
